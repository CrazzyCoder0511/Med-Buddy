<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Page not found — MedBuddy</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/Med-Buddy/medbuddy-icon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" />
<script>
  /* Match whichever theme the visitor had chosen on the real app. */
  try {
    var savedTheme = localStorage.getItem('medbuddy.theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #f7efe1;
    --surface: #fffdf6;
    --border: #e4d8c2;
    --text: #26211a;
    --muted: #6f6555;
    --accent: #12805c;
    --accent-hover: #0e6b4c;
    --on-accent: #ffffff;
    --shadow: 0 1px 3px rgba(60, 45, 20, 0.1), 0 1px 2px rgba(60, 45, 20, 0.06);
  }
  :root[data-theme="dark"] {
    --bg: #14181a;
    --surface: #1d2224;
    --border: #363c3e;
    --text: #f3f4f2;
    --muted: #a2a8ab;
    --accent: #34caa0;
    --accent-hover: #4bd8b0;
    --on-accent: #0c1210;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181a;
      --surface: #1d2224;
      --border: #363c3e;
      --text: #f3f4f2;
      --muted: #a2a8ab;
      --accent: #34caa0;
      --accent-hover: #4bd8b0;
      --on-accent: #0c1210;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    padding: 1.5rem;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 2.2rem 1.8rem;
    text-align: center;
  }
  .mark {
    width: 72px; height: 72px;
    border-radius: 18px;
    margin-bottom: 1.1rem;
    box-shadow: 0 4px 14px rgba(20, 20, 15, 0.16);
  }
  h1 {
    font-family: Poppins, Inter, sans-serif;
    font-size: 1.5rem;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 0 0 0.5rem;
  }
  p {
    color: var(--muted);
    font-size: 0.95rem;
    line-height: 1.55;
    margin: 0 0 1.6rem;
  }
  .code {
    display: inline-block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.25rem 0.75rem;
    margin-bottom: 1.4rem;
  }
  .btn {
    display: inline-block;
    appearance: none;
    font: inherit; font-size: 0.95rem; font-weight: 600;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="card">
  <img class="mark" src="/Med-Buddy/medbuddy-icon.png" width="72" height="72" alt="" />
  <span class="code">404</span>
  <h1>This page took a wrong turn.</h1>
  <p>The page you're looking for doesn't exist — it may have moved, or the link might be off. Your medication schedule is safe either way; it's just this page that's lost.</p>
  <a class="btn" href="/Med-Buddy/">Back to MedBuddy</a>
</div>

</body>
</html>
